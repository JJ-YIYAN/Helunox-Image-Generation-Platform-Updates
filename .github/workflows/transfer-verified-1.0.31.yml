name: Transfer verified release
on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Verified assets and expiring GitHub download URLs
        required: true
        type: string
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify release assets
        env:
          TRANSFER_MANIFEST: ${{ inputs.manifest }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re, urllib.request, urllib.parse
          manifest = json.loads(os.environ['TRANSFER_MANIFEST'])
          tag = manifest['tag']
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag)
          version = tag[1:]
          names = {f'Helunox-Setup-{version}.exe', f'Helunox-Portable-{version}.exe', f'Helunox-Setup-{version}.exe.blockmap', 'latest.yml'}
          assert len(manifest['assets']) == 4 and {a['name'] for a in manifest['assets']} == names
          pathlib.Path('release').mkdir()
          for asset in manifest['assets']:
              url = urllib.parse.urlparse(asset['url'])
              assert url.scheme == 'https' and url.hostname == 'release-assets.githubusercontent.com'
              digest = hashlib.sha256()
              size = 0
              with urllib.request.urlopen(asset['url'], timeout=60) as response, open(pathlib.Path('release') / asset['name'], 'wb') as output:
                  assert urllib.parse.urlparse(response.url).hostname == url.hostname
                  while block := response.read(1024 * 1024):
                      output.write(block)
                      digest.update(block)
                      size += len(block)
              assert size == asset['size'] and 'sha256:' + digest.hexdigest() == asset['digest'], asset['name']
              print('Verified:', asset['name'], size)
          installer = pathlib.Path('release', f'Helunox-Setup-{version}.exe').read_bytes()
          updater = pathlib.Path('release/latest.yml').read_text()
          assert f'version: {version}\n' in updater
          assert base64.b64encode(hashlib.sha512(installer).digest()).decode() in updater
          pathlib.Path('release-notes.md').write_text(manifest['notes'], encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'TAG={tag}\nVERSION={version}\n')
          PY
      - name: Publish complete verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --json isDraft > release-state.json; then
            python3 -c "import json; assert json.load(open('release-state.json'))['isDraft'], 'Release already published'"
          else
            gh release create "$TAG" --draft --title "$TAG" --notes-file release-notes.md
          fi
          gh release upload "$TAG" \
            "release/Helunox-Setup-$VERSION.exe" \
            "release/Helunox-Portable-$VERSION.exe" \
            "release/Helunox-Setup-$VERSION.exe.blockmap" \
            release/latest.yml
          gh release edit "$TAG" --draft=false --latest --notes-file release-notes.md
